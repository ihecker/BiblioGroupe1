<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-sm" style="width: 600px">
    <div>
      <div class="card shadow-sm">
        <div class="card-header bg-info text-white">
          <h5 class="mb-0">Ajouter un genre</h5>
        </div>

        <form (submit)="addGenre()" [formGroup]="formGenre">
          <div class="mb-3 row">
            <label for="libelle" class="col-sm-2 col-form-label">Libellé</label>
            <div class="col-sm-10">
              <input
                type="text"
                class="form-control"
                id="libelle"
                formControlName="libelle"
                [class.is-invalid]="formLibelleCtrl.invalid"
              />
              <div *ngIf="formLibelleCtrl.hasError('required')" class="invalid-feedback">
                Le libellé est obligatoire
              </div>
            </div>
          </div>

          <button class="btn btn-success w-100" type="submit">Ajouter</button>
        </form>

        <hr />

        <!-- HEADER -->
        <div
          class="card-header bg-info text-white d-flex justify-content-between align-items-center"
        >
          <h5 class="mb-0">Liste des genres</h5>
          <span class="badge bg-light text-dark">
            {{ (genres$ | async)?.length || 0 }} genres
          </span>
        </div>

        <table class="table table-striped">
          <thead>
            <tr>
              <th>ID</th>
              <th>Libellé</th>
              <th class="text-end">Actions</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let genre of genres$ | async">
              <td>{{ genre.id }}</td>
              <td>{{ genre.libelle }}</td>
              <td class="text-end">
                <button class="btn btn-danger" (click)="deleteGenre(genre)">Supprimer</button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
