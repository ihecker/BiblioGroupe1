<h1>Avis</h1>

<table class="table table-striped">
    <thead>
        <th>Id</th>
        <th>Note</th>
        <th>Commentaire</th>
        <th>Date</th>
        <th>Livre</th>
        <th></th>
        <th></th>
    </thead>
    <tbody>
        <tr *ngFor="let a of avis$ | async">
            <td>{{a.id}}</td>
            <td>{{a.note}}</td>
            <td>{{a.commentaire}}</td>
            <td>{{a.date}}</td>
            <td>{{a.livreId}} - {{a.livreTitre}}</td>
            <td><button type="button" class="btn btn-warning mx-1" (click)="updatableAvis(a)">Modifier</button>
                <button type="button" class="btn btn-danger  mx-1" (click)="deleteAvis(a.id)">Supprimer</button>
            </td>
        </tr>
    </tbody>
</table>

<br />

<div *ngIf="update">
    
    <h3>Modification avis</h3>

    <label for="modifAvisNote" class="form-label">Note</label>
    <input type="text" class="form-control" id="modifAvisNote" [(ngModel)]="updatedAvis.note">
    <label for="modifAvisCommentaire" class="form-label">Commentaire</label>
    <input type="text" class="form-control" id="modifAvisCommentaire" [(ngModel)]="updatedAvis.commentaire">
    <label for="modifAvisDate" class="form-label">Date</label>
    <input type="date" class="form-control" id="modifAvisDate" [(ngModel)]="updatedAvis.date">
    <label for="modifAvisLivreId" class="form-label">Livre (id)</label>
    <input type="number" class="form-control" id="modifAvisLivreId" [(ngModel)]="updatedAvis.livreId">
    <label for="modifAvisLivreTitre" class="form-label">Livre (titre)</label>
    <input type="text" class="form-control" id="modifAvisLivreTitre" [(ngModel)]="updatedAvis.livreTitre">


    <button type="button" class="btn btn-success" (click)="updateAvis()">Valider</button>
</div>

<div *ngIf="!update">
   
    <h3> Laisser un avis :</h3>
   
    <form (submit)="addAvis()" [formGroup]="formAvis">
    
    <label for="note" class="col-sm-2 col-form-label">Note</label>
    <input type="number" class="form-control mb-2" id="note" formControlName="note"
        [class.is-invalid]="formNoteCtrl.invalid" />
    <div *ngIf="formNoteCtrl.hasError('required')" class="invalid-feedback">La note est obligatoire</div>
    <div *ngIf="formNoteCtrl.hasError('value')" class="invalid-feedback">La note doit être comprise entre 0 et 10</div>
    
    <label for="commentaire" class="col-2 col-form-label">Commentaire</label>
    <input type="text" class="form-control mb-2" id="commentaire" formControlName="commentaire"/>
    
    <label for="date" class="col-sm-2 col-form-label">Date</label>
    <input type="date" class="form-control mb-2" id="date" formControlName="date"/>
    <!-- <div *ngIf="formDateCtrl.hasError('required')" class="invalid-feedback">La date est obligatoire</div> -->
    
     <label for="livreId" class="col-sm-2 col-form-label">Livre (id)</label>
    <input type="number" class="form-control mb-2" id="livreId" formControlName="livreId"
        [class.is-invalid]="formLivreIdCtrl.invalid" />
    <div *ngIf="formLivreIdCtrl.hasError('required')" class="invalid-feedback">L'id du livre est obligatoire</div>
    
     <label for="livreTitre" class="col-sm-2 col-form-label">Livre (titre)</label>
    <input type="text" class="form-control mb-2" id="livreTitre" formControlName="livreTitre"
        [class.is-invalid]="formLivreTitreCtrl.invalid" />
    <div *ngIf="formLivreTitreCtrl.hasError('required')" class="invalid-feedback">Le titre du livre est obligatoire</div>
    
    <div class="mt-3">
        <input [disabled]="formAvis.invalid" type="submit" class="btn btn-success" value="Ajouter" />
    </div>
</form>
</div>
